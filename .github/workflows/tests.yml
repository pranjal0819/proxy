    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "django-insecure-x9x*hl2v(%3bn2vkf+#nj8#1z9!aj#_ht@2v%q=9#*6e+2l5cw"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
